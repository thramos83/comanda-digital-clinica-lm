<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comanda Digital - Clínica LM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #f9f6f0;
      --bg-card: #ffffff;
      --sand-light: #f3ece4;
      --sand-dark: #d8c8b8;
      --gold-primary: #c5a059;
      --gold-dark: #8c672f;
      --text-main: #2c2825;
      --text-muted: #736b63;
      --border-color: #e8ded4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 40px; }

    header {
      background: linear-gradient(135deg, #f5ede4 0%, #ebdcd0 100%);
      border-bottom: 2px solid var(--sand-dark);
      padding: 18px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }
    .header-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-area { display: flex; align-items: center; gap: 15px; }
    
    .logo-svg { width: 55px; height: 55px; }
    .logo-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; color: var(--gold-dark); letter-spacing: 2px; }
    .logo-subtitle { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; }

    .nav-buttons { display: flex; gap: 10px; }
    .btn-nav {
      background: #ffffff;
      border: 1px solid var(--sand-dark);
      color: var(--gold-dark);
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-nav:hover, .btn-nav.active { background: var(--gold-primary); color: #fff; border-color: var(--gold-primary); }

    .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
    .card {
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 25px rgba(0,0,0,0.03);
      padding: 28px;
      margin-bottom: 25px;
    }
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--gold-dark);
      margin-bottom: 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Grid com margens e alinhamentos simétricos */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.8px; }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background-color: #faf7f2;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }
    
    /* Centralização da Data */
    input[type="date"], #data { text-align: center; }

    input:focus, select:focus, textarea:focus { 
      border-color: var(--gold-primary); 
      background-color: #ffffff; 
      box-shadow: 0 0 0 3px rgba(197,160,89,0.15); 
    }

    .card-flags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .flag-opt {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      background: #faf7f2;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .flag-opt.selected { background: var(--gold-primary); color: #fff; border-color: var(--gold-primary); }

    .btn-submit {
      background: linear-gradient(135deg, #c5a059 0%, #8c672f 100%);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(140,103,47,0.25);
      transition: all 0.2s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(140,103,47,0.35); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards do Resumo Financeiro */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 22px;
    }
    .summary-card {
      background: #faf7f2;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .summary-card .title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .summary-card .value { font-size: 20px; font-weight: 700; color: var(--gold-dark); margin-top: 6px; }

    /* Barra de Busca e Filtros */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 180px; }
    .btn-quick-filter {
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .btn-quick-filter:hover, .btn-quick-filter.active { background: var(--gold-primary); color: #fff; border-color: var(--gold-primary); }

    /* Tabela Responsiva com Alinhamento Perfeito */
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; min-width: 700px; }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); }
    th { background-color: #faf7f2; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 11px; }

    .badge-status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-pago { background-color: #e2f0d9; color: #385723; }
    .badge-pendente { background-color: #fce4d6; color: #c65911; }

    .btn-action {
      background: none;
      border: none;
      color: var(--gold-dark);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
    }

    .total-highlight { background-color: #f3ece4; font-weight: bold; color: var(--gold-dark); }

    @media (max-width: 600px) {
      .header-container { flex-direction: column; gap: 15px; text-align: center; }
      .logo-area { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area">
        <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 40,35 C 42,105 48,140 72,140 C 92,140 102,112 112,108 C 122,104 128,122 138,122 C 148,122 158,112 175,128" 
                stroke="url(#goldGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#D4AF37" />
              <stop offset="50%" stop-color="#F3E5AB" />
              <stop offset="100%" stop-color="#AA7C11" />
            </linearGradient>
          </defs>
        </svg>
        <div>
          <div class="logo-title">CLÍNICA LM</div>
          <div class="logo-subtitle">Comanda Digital de Atendimento</div>
        </div>
      </div>
      <div class="nav-buttons">
        <button class="btn-nav active" onclick="switchTab('comanda', this)"><i class="fa-solid fa-pen-to-square"></i> Nova Comanda</button>
        <button class="btn-nav" onclick="switchTab('historico', this)"><i class="fa-solid fa-list-check"></i> Recepção / Financeiro</button>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- ABA NOVA COMANDA -->
    <div id="tab-comanda" class="tab-content active">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-file-invoice"></i> Dados do Atendimento</div>
        <form id="formComanda" onsubmit="salvarComanda(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Paciente *</label>
              <input type="text" id="paciente" required placeholder="Nome completo do paciente">
            </div>
            <div class="form-group">
              <label>Data *</label>
              <input type="date" id="data" required>
            </div>
            <div class="form-group">
              <label>Profissional Responsável *</label>
              <select id="profissional" required>
                <option value="">Selecione...</option>
                <option value="Dra. Lorena">Dra. Lorena</option>
                <option value="Dra. Fatyene">Dra. Fatyene</option>
                <option value="Dra. Camila">Dra. Camila</option>
                <option value="Alê Cardoso">Alê Cardoso</option>
                <option value="Letycia">Letycia</option>
              </select>
            </div>
            <div class="form-group">
              <label>Indicação</label>
              <select id="indicacao">
                <option value="">Nenhuma / Outra</option>
                <option value="Dra. Lorena">Dra. Lorena</option>
                <option value="Dra. Fatyene">Dra. Fatyene</option>
                <option value="Dra. Camila">Dra. Camila</option>
                <option value="Alê Cardoso">Alê Cardoso</option>
                <option value="Letycia">Letycia</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Procedimento(s) Realizado(s)</label>
              <textarea id="procedimento" rows="2" placeholder="Descreva os procedimentos..."></textarea>
            </div>
            <div class="form-group full">
              <label>Produtos de Home Care</label>
              <textarea id="home_care" rows="2" placeholder="Produtos indicados/adquiridos..."></textarea>
            </div>
            <div class="form-group">
              <label>Próximo Agendamento / Retorno</label>
              <input type="text" id="proximo_agendamento" placeholder="Ex: Retorno em 15 dias (10/10 às 14h)">
            </div>
            
            <div class="form-group">
              <label>Forma de Pagamento</label>
              <select id="forma_pagamento" onchange="toggleCartaoFlags()">
                <option value="Dinheiro">Dinheiro</option>
                <option value="PIX">PIX</option>
                <option value="Cartão">Cartão</option>
              </select>
            </div>
            
            <div class="form-group full" id="group-bandeira" style="display: none;">
              <label>Bandeira & Parcelas do Cartão</label>
              <div class="card-flags">
                <span class="flag-opt" onclick="selectFlag(this, 'Mastercard')">Mastercard</span>
                <span class="flag-opt" onclick="selectFlag(this, 'Visa')">Visa</span>
                <span class="flag-opt" onclick="selectFlag(this, 'Amex')">Amex</span>
                <span class="flag-opt" onclick="selectFlag(this, 'Elo')">Elo</span>
                <span class="flag-opt" onclick="selectFlag(this, 'Hipercard')">Hipercard</span>
              </div>
              <select id="parcelas_cartao" style="margin-top: 8px;">
                <option value="1x À vista">À vista (1x)</option>
                <option value="2x">2x sem juros</option>
                <option value="3x">3x sem juros</option>
                <option value="4x">4x</option>
                <option value="5x">5x</option>
                <option value="6x">6x</option>
                <option value="10x">10x</option>
                <option value="12x">12x</option>
              </select>
              <input type="hidden" id="bandeira_cartao">
            </div>

            <div class="form-group">
              <label>Status do Pagamento</label>
              <select id="status_pagamento">
                <option value="Pendente">Pendente</option>
                <option value="Pago">Pago</option>
                <option value="Parcial">Parcial</option>
              </select>
            </div>

            <!-- CÁLCULO AUTOMÁTICO DE VALORES -->
            <div class="form-group">
              <label>Valor Procedimento(s) (R$)</label>
              <input type="number" step="0.01" id="valor_procedimento" placeholder="0,00" oninput="calcularTotal()">
            </div>

            <div class="form-group">
              <label>Valor Produto(s) (R$)</label>
              <input type="number" step="0.01" id="valor_produto" placeholder="0,00" oninput="calcularTotal()">
            </div>

            <div class="form-group full">
              <label>Valor Total Somado (R$)</label>
              <input type="number" step="0.01" id="valor" class="total-highlight" placeholder="0,00" readonly>
            </div>

          </div>

          <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> Gravar Comanda</button>
        </form>
      </div>
    </div>

    <!-- ABA HISTÓRICO / RECEPÇÃO / FINANCEIRO -->
    <div id="tab-historico" class="tab-content">
      
      <!-- Resumo Financeiro em Cards -->
      <div class="summary-grid">
        <div class="summary-card">
          <div class="title">Total Faturado</div>
          <div class="value" id="total-faturado">R$ 0,00</div>
        </div>
        <div class="summary-card">
          <div class="title">Total Recebido (Pago)</div>
          <div class="value" style="color: #2e7d32;" id="total-pago">R$ 0,00</div>
        </div>
        <div class="summary-card">
          <div class="title">Pendente de Cobrança</div>
          <div class="value" style="color: #c65911;" id="total-pendente">R$ 0,00</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fa-solid fa-list"></i> Comandas Registradas</div>
        
        <!-- Barra de Busca e Filtros Rápidos -->
        <div class="filter-bar">
          <input type="text" id="search-paciente" placeholder="🔍 Buscar por paciente..." onkeyup="filtrarComandas()">
          <select id="filter-profissional" onchange="filtrarComandas()">
            <option value="">Todas as Profissionais</option>
            <option value="Dra. Lorena">Dra. Lorena</option>
            <option value="Dra. Fatyene">Dra. Fatyene</option>
            <option value="Dra. Camila">Dra. Camila</option>
            <option value="Alê Cardoso">Alê Cardoso</option>
            <option value="Letycia">Letycia</option>
          </select>
          <div style="display: flex; gap: 6px;">
            <button class="btn-quick-filter active" onclick="setFilterPeriod('hoje', this)">Hoje</button>
            <button class="btn-quick-filter" onclick="setFilterPeriod('semana', this)">Semana</button>
            <button class="btn-quick-filter" onclick="setFilterPeriod('todos', this)">Todos</button>
          </div>
        </div>

        <div class="table-responsive">
          <table id="tabelaComandas">
            <thead>
              <tr>
                <th>Data</th>
                <th>Paciente</th>
                <th>Profissional</th>
                <th>Valor Total</th>
                <th>Pagamento</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista-comandas-body">
              <tr><td colspan="7" style="text-align:center; color: var(--text-muted);">Carregando comandas...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('data').valueAsDate = new Date();
    let comandasDados = [];

    function calcularTotal() {
      const vProc = parseFloat(document.getElementById('valor_procedimento').value) || 0;
      const vProd = parseFloat(document.getElementById('valor_produto').value) || 0;
      const total = vProc + vProd;
      document.getElementById('valor').value = total.toFixed(2);
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if(btn) btn.classList.add('active');
      if(tab === 'historico') carregarHistorico();
    }

    function toggleCartaoFlags() {
      const forma = document.getElementById('forma_pagamento').value;
      document.getElementById('group-bandeira').style.display = (forma === 'Cartão') ? 'block' : 'none';
    }

    function selectFlag(el, flag) {
      document.querySelectorAll('.flag-opt').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('bandeira_cartao').value = flag;
    }

    function salvarComanda(e) {
      e.preventDefault();
      
      const novaComanda = {
        data: document.getElementById('data').value,
        paciente: document.getElementById('paciente').value,
        profissional: document.getElementById('profissional').value,
        indicacao: document.getElementById('indicacao').value,
        procedimento: document.getElementById('procedimento').value,
        home_care: document.getElementById('home_care').value,
        proximo_agendamento: document.getElementById('proximo_agendamento').value,
        forma_pagamento: document.getElementById('forma_pagamento').value,
        bandeira_cartao: document.getElementById('bandeira_cartao').value,
        parcelas_cartao: document.getElementById('parcelas_cartao').value,
        status_pagamento: document.getElementById('status_pagamento').value,
        valor_procedimento: parseFloat(document.getElementById('valor_procedimento').value) || 0,
        valor_produto: parseFloat(document.getElementById('valor_produto').value) || 0,
        valor_total: parseFloat(document.getElementById('valor').value) || 0
      };

      comandasDados.unshift(novaComanda);
      alert('Comanda de ' + novaComanda.paciente + ' gravada com sucesso!');
      document.getElementById('formComanda').reset();
      document.getElementById('data').valueAsDate = new Date();
      document.getElementById('group-bandeira').style.display = 'none';
    }

    function carregarHistorico() {
      renderizarTabela(comandasDados);
    }

    function renderizarTabela(dados) {
      const tbody = document.getElementById('lista-comandas-body');
      tbody.innerHTML = '';

      if(dados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhuma comanda encontrada.</td></tr>';
        atualizarResumo(0, 0, 0);
        return;
      }

      let totalFat = 0, totalP = 0, totalPend = 0;

      dados.forEach((c, index) => {
        totalFat += c.valor_total;
        if(c.status_pagamento === 'Pago') totalP += c.valor_total;
        else totalPend += c.valor_total;

        const dataFmt = c.data ? c.data.split('-').reverse().join('/') : '-';
        const badgeClass = c.status_pagamento === 'Pago' ? 'badge-pago' : 'badge-pendente';

        const row = `
          <tr>
            <td>${dataFmt}</td>
            <td><strong>${c.paciente}</strong></td>
            <td>${c.profissional}</td>
            <td>R$ ${c.valor_total.toFixed(2)}</td>
            <td>${c.forma_pagamento} ${c.bandeira_cartao ? '(' + c.bandeira_cartao + ')' : ''}</td>
            <td><span class="badge-status ${badgeClass}">${c.status_pagamento}</span></td>
            <td>
              <button class="btn-action" title="Imprimir Comanda" onclick="imprimirComanda(${index})"><i class="fa-solid fa-print"></i></button>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      atualizarResumo(totalFat, totalP, totalPend);
    }

    function atualizarResumo(fat, pago, pend) {
      document.getElementById('total-faturado').innerText = 'R$ ' + fat.toFixed(2);
      document.getElementById('total-pago').innerText = 'R$ ' + pago.toFixed(2);
      document.getElementById('total-pendente').innerText = 'R$ ' + pend.toFixed(2);
    }

    function filtrarComandas() {
      const termo = document.getElementById('search-paciente').value.toLowerCase();
      const prof = document.getElementById('filter-profissional').value;

      const filtradas = comandasDados.filter(c => {
        const matchNome = c.paciente.toLowerCase().includes(termo);
        const matchProf = prof === '' || c.profissional === prof;
        return matchNome && matchProf;
      });

      renderizarTabela(filtradas);
    }

    function setFilterPeriod(periodo, btn) {
      document.querySelectorAll('.btn-quick-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if(periodo === 'todos') {
        renderizarTabela(comandasDados);
        return;
      }

      const hoje = new Date().toISOString().split('T')[0];
      const filtradas = comandasDados.filter(c => c.data === hoje);
      renderizarTabela(filtradas);
    }

    function imprimirComanda(index) {
      const c = comandasDados[index];
      const win = window.open('', '', 'width=600,height=600');
      win.document.write(`
        <html>
        <head><title>Comanda - ${c.paciente}</title></head>
        <body style="font-family: sans-serif; padding: 20px;">
          <h2>CLÍNICA LM - COMANDA DIGITAL</h2>
          <hr>
          <p><strong>Paciente:</strong> ${c.paciente}</p>
          <p><strong>Data:</strong> ${c.data}</p>
          <p><strong>Profissional:</strong> ${c.profissional}</p>
          <p><strong>Procedimentos:</strong> ${c.procedimento || 'Nenhum'}</p>
          <p><strong>Produtos:</strong> ${c.home_care || 'Nenhum'}</p>
          <p><strong>Valor Total:</strong> R$ ${c.valor_total.toFixed(2)}</p>
          <p><strong>Forma de Pagamento:</strong> ${c.forma_pagamento} (${c.status_pagamento})</p>
          <br><br>
          <p style="text-align: center;">___________________________________<br>Assinatura / Conferência</p>
        </body>
        </html>
      `);
      win.print();
    }
  </script>
</body>
</html>
