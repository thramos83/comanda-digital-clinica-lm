<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda Digital - Clínica LM</title>
    <!-- Tailwind CSS via CDN para estilização rápida e limpa -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4">
    <div class="max-w-4xl mx-auto">
        <header class="bg-white shadow rounded-lg p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">Comanda Digital</h1>
                <p class="text-sm text-gray-500">Clínica LM - Sincronização em Tempo Real</p>
            </div>
            <div id="status-conexao" class="text-xs px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full font-semibold">
                Conectando...
            </div>
        </header>

        <!-- Formulário para Nova Comanda -->
        <section class="bg-white shadow rounded-lg p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Abrir Nova Comanda</h2>
            <form id="form-comanda" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Paciente</label>
                    <input type="text" id="paciente" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Profissional</label>
                    <input type="text" id="profissional" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Procedimentos (separados por vírgula)</label>
                    <input type="text" id="procedimentos" placeholder="Ex: Limpeza de pele, Botox" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Forma de Pagamento</label>
                    <select id="forma_pagamento" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Pix">Pix</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Bandeira do Cartão (se aplicável)</label>
                    <input type="text" id="bandeira" placeholder="Ex: Visa, Master, Elo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition">
                        Salvar e Sincronizar Comanda
                    </button>
                </div>
            </form>
        </section>

        <!-- Lista de Comandas Ativas -->
        <section class="bg-white shadow rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Comandas Ativas / Sincronizadas</h2>
            <div id="lista-comandas" class="space-y-3">
                <p class="text-sm text-gray-400">Carregando comandas...</p>
            </div>
        </section>
    </div>

    <script>
        // Configuração do Supabase com suas chaves
        const SUPABASE_URL = 'https://ntvcgqbenpxfxvejxkoy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_UxiIkEbCXmYA10M0f_PIoA_1j52p3gB';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusConexao = document.getElementById('status-conexao');
        const listaComandas = document.getElementById('lista-comandas');
        const formComanda = document.getElementById('form-comanda');

        // Função para buscar e renderizar comandas
        async function carregarComandas() {
            const { data, error } = await supabaseClient
                .from('comandas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao buscar:', error);
                statusConexao.textContent = 'Erro na conexão';
                statusConexao.className = 'text-xs px-3 py-1 bg-red-100 text-red-800 rounded-full font-semibold';
                return;
            }

            statusConexao.textContent = 'Conectado (Tempo Real Ativo)';
            statusConexao.className = 'text-xs px-3 py-1 bg-green-100 text-green-800 rounded-full font-semibold';

            if (!data || data.length === 0) {
                listaComandas.innerHTML = '<p class="text-sm text-gray-500">Nenhuma comanda cadastrada ainda.</p>';
                return;
            }

            listaComandas.innerHTML = data.map(c => `
                <div class="border rounded-lg p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-2 bg-gray-50">
                    <div>
                        <span class="font-bold text-blue-900">${c.paciente}</span> 
                        <span class="text-xs text-gray-500">(Prof: ${c.profissional})</span>
                        <p class="text-sm text-gray-700 mt-1"><strong>Procedimentos:</strong> ${Array.isArray(c.procedimentos) ? c.procedimentos.join(', ') : c.procedimentos}</p>
                        <p class="text-xs text-gray-500">Pgto: ${c.formas_pagamento || 'Não informado'} | Bandeira: ${c.bandeiras_cartao || 'N/A'}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="px-2 py-1 text-xs rounded bg-blue-100 text-blue-800 font-semibold">${c.status}</span>
                        <button onclick="deletarComanda('${c.id}')" class="text-red-500 hover:text-red-700 text-xs font-semibold border border-red-200 px-2 py-1 rounded">Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        // Salvar nova comanda
        formComanda.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const novaComanda = {
                paciente: document.getElementById('paciente').value,
                profissional: document.getElementById('profissional').value,
                procedimentos: document.getElementById('procedimentos').value.split(',').map(p => p.trim()),
                formas_pagamento: document.getElementById('forma_pagamento').value,
                bandeiras_cartao: document.getElementById('bandeira').value,
                status: 'Aberta'
            };

            const { error } = await supabaseClient.from('comandas').insert([novaComanda]);

            if (error) {
                alert('Erro ao salvar comanda: ' + error.message);
            } else {
                formComanda.reset();
            }
        });

        // Deletar comanda
        window.deletarComanda = async function(id) {
            if (confirm('Deseja realmente excluir esta comanda?')) {
                await supabaseClient.from('comandas').delete().eq('id', id);
            }
        };

        // Escutar alterações em Tempo Real (Realtime) entre os aparelhos
        supabaseClient
            .channel('public:comandas')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'comandas' }, payload => {
                console.log('Mudança detectada:', payload);
                carregarComandas(); // Atualiza a lista instantaneamente em todos os aparelhos
            })
            .subscribe();

        // Carga inicial ao abrir a página
        carregarComandas();
    </script>
</body>
</html>
